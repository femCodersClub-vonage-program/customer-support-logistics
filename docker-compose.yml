name: customer-support-logistics

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_support_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: server -s3 -dir=/data -s3.port=8333
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-dev_only_seaweedfs_secret}
      S3_BUCKET: ${STORAGE_BUCKET:-evidence}
    ports:
      - '${STORAGE_PORT:-8333}:8333'
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'test -d /data']
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs-init:
    image: amazon/aws-cli:2.22.35
    restart: 'no'
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-dev_only_seaweedfs_secret}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-evidence}
      # Comma-separated browser origins allowed to use presigned evidence URLs.
      # Add the HTTPS tunnel origin here when testing the PWA on a phone.
      STORAGE_CORS_ALLOWED_ORIGINS: ${STORAGE_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do
          sleep 2
        done
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$${STORAGE_BUCKET}" \
          || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket "$${STORAGE_BUCKET}"
        origins_json=''
        old_ifs="$$IFS"
        IFS=,
        set -- $$STORAGE_CORS_ALLOWED_ORIGINS
        IFS="$$old_ifs"
        for origin; do
          case "$$origin" in
            http://*|https://*) ;;
            *) echo "Invalid STORAGE_CORS_ALLOWED_ORIGINS entry: $$origin" >&2; exit 1 ;;
          esac
          if [ -n "$$origins_json" ]; then origins_json="$$origins_json,"; fi
          origins_json="$$origins_json\"$$origin\""
        done
        test -n "$$origins_json"
        aws --endpoint-url http://seaweedfs:8333 s3api put-bucket-cors \
          --bucket "$$STORAGE_BUCKET" \
          --cors-configuration "{\"CORSRules\":[{\"ID\":\"pwa-presigned-evidence\",\"AllowedOrigins\":[$$origins_json],\"AllowedMethods\":[\"GET\",\"HEAD\",\"PUT\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}"
        aws --endpoint-url http://seaweedfs:8333 s3api get-bucket-cors --bucket "$$STORAGE_BUCKET"

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
